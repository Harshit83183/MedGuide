
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta name="robots" content="noindex,nofollow">
  <title>MedGuide Live SOS Tracking</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #17253c;
      max-width: 600px;
      margin: 40px auto;
      padding: 16px;
    }

    main {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #0001;
    }

    h1 {
      color: #dc2626;
    }

    #status {
      font-weight: bold;
    }

    a {
      color: #1464ce;
    }
  </style>
</head>

<body>
  <main>
    <h1>MedGuide Emergency SOS</h1>

    <p id="status">
      Connecting to live tracking...
    </p>

    <p id="coordinates"></p>
    <p id="updated"></p>

    <a
      id="map"
      target="_blank"
      rel="noopener noreferrer"
      hidden
    >
      View location on Google Maps
    </a>

    <p>
      Keep this page open for location updates.
      If updates stop, contact the person directly.
    </p>
  </main>

  <script>
    const token = new URLSearchParams(
      window.location.search
    ).get("token");

    const statusEl =
      document.getElementById("status");

    const coordinatesEl =
      document.getElementById("coordinates");

    const updatedEl =
      document.getElementById("updated");

    const mapEl =
      document.getElementById("map");

    let timer;

    async function refreshLocation() {
      if (!token) {
        statusEl.textContent =
          "Invalid tracking link";
        return;
      }

      try {
        const response = await fetch(
          "/api/sos-location?token=" +
          encodeURIComponent(token),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "Tracking request failed"
          );
        }

        const data =
          await response.json();

        if (data.status !== "active") {
          statusEl.textContent =
            "SOS resolved. Live tracking stopped.";

          coordinatesEl.textContent = "";
          updatedEl.textContent = "";
          mapEl.hidden = true;

          clearInterval(timer);
          return;
        }

        if (!data.point) {
          statusEl.textContent =
            "Waiting for GPS location...";
          return;
        }

        const point = data.point;

        const age =
          Date.now() -
          new Date(
            point.created_at
          ).getTime();

        statusEl.textContent =
          age > 30000
            ? "Last known location — GPS updates delayed"
            : "SOS active — location updating";

        coordinatesEl.textContent =
          Number(point.latitude).toFixed(6) +
          ", " +
          Number(point.longitude).toFixed(6);

        updatedEl.textContent =
          "Last update: " +
          new Date(
            point.created_at
          ).toLocaleString() +
          " (" +
          Math.round(age / 1000) +
          " seconds ago)";

        mapEl.href =
          "https://www.google.com/maps?q=" +
          encodeURIComponent(
            point.latitude +
            "," +
            point.longitude
          );

        mapEl.hidden = false;
      } catch {
        statusEl.textContent =
          "Unable to refresh location.";
      }
    }

    refreshLocation();

    timer = setInterval(
      refreshLocation,
      5000
    );
  </script>
</body>
</html>
